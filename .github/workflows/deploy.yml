name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          SUPABASE_URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY_SECRET: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # The build normally reads .env.production, which is committed: a Supabase anon
          # key is public by design, and row level security is what actually protects the
          # data. Repository secrets, if set, take precedence — an empty secret must not
          # blank out the committed value, hence the guards.
          if [ -n "$SUPABASE_URL_SECRET" ]; then
            export VITE_SUPABASE_URL="$SUPABASE_URL_SECRET"
          fi
          if [ -n "$SUPABASE_KEY_SECRET" ]; then
            export VITE_SUPABASE_ANON_KEY="$SUPABASE_KEY_SECRET"
          fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
